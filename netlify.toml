# Static PWA plus two serverless functions (incident commander backend). No build step for the site itself.
[build]
  publish = "."
  command = "echo 'no build step'"

[build.environment]
  NODE_VERSION = "20"
  # Only the runtime dependencies (@netlify/blobs, @google-cloud/firestore) are needed on Netlify; the test tooling stays local.
  NPM_FLAGS = "--omit=dev --no-audit --no-fund"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["lib.js", "netlify/lib/**"]
  # Loaded only when the Firestore (UK) settings are present; shipped as a normal package rather than bundled.
  external_node_modules = ["@google-cloud/firestore"]
